name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, xml, curl
          coverage: none

      # El CI corre el mismo gate que local, no una copia paralela.
      # verificar.sh detecta un proyecto recien creado (sin composer.json,
      # sin phpunit.xml) y lo reporta como SIN_SUITE sin marcar el CI en rojo.
      # Asi el primer push de la estructura no genera una alerta falsa.
      - name: Verificar
        run: sh verificar.sh
